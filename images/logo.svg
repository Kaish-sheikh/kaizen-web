<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="none">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f0eb"/>
      <stop offset="100%" stop-color="#d4a574"/>
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b1a2a" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#6b1a2a" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f0eb"/>
      <stop offset="100%" stop-color="#d4a574"/>
    </linearGradient>
  </defs>
  
  <!-- Orbital Swoosh (behind text) -->
  <ellipse cx="200" cy="95" rx="185" ry="38" stroke="url(#swooshGrad)" stroke-width="2.5" fill="none" transform="rotate(-8, 200, 95)"/>
  
  <!-- Second thinner swoosh -->
  <ellipse cx="200" cy="95" rx="170" ry="28" stroke="url(#swooshGrad)" stroke-width="1" fill="none" transform="rotate(-6, 200, 95)" opacity="0.4"/>
  
  <!-- Star accent - four pointed star above the K -->
  <g transform="translate(52, 28)">
    <path d="M0,-14 L2.5,-3 L14,0 L2.5,3 L0,14 L-2.5,3 L-14,0 L-2.5,-3 Z" fill="url(#starGrad)"/>
    <circle cx="0" cy="0" r="2" fill="#f5f0eb"/>
  </g>
  
  <!-- Small sparkle -->
  <g transform="translate(38, 42)">
    <path d="M0,-5 L1,-1 L5,0 L1,1 L0,5 L-1,1 L-5,0 L-1,-1 Z" fill="#d4a574" opacity="0.6"/>
  </g>

  <!-- KAIZEN text - bold italic -->
  <text x="62" y="115" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="80" font-style="italic" fill="url(#textGrad)" letter-spacing="-1">
    KAIZEN
  </text>
  
  <!-- 改善 kanji -->
  <text x="340" y="62" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="26" fill="#d4a574" opacity="0.85">
    改善
  </text>
  
  <!-- Thin underline accent -->
  <line x1="80" y1="125" x2="340" y2="125" stroke="#d4a574" stroke-width="1" opacity="0.2"/>
</svg>
