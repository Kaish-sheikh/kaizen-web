<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f0eb"/>
      <stop offset="100%" stop-color="#d4a574"/>
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b1a2a" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#6b1a2a" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6b1a2a"/>
      <stop offset="100%" stop-color="#d4a574" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  
  <!-- Circle background -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="2"/>
  
  <!-- Orbital swoosh -->
  <ellipse cx="60" cy="62" rx="48" ry="14" stroke="url(#swooshGrad)" stroke-width="1.5" fill="none" transform="rotate(-8, 60, 62)"/>
  
  <!-- K letter - bold -->
  <text x="60" y="76" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="52" font-style="italic" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-2">
    K
  </text>
  
  <!-- Star -->
  <g transform="translate(36, 30)">
    <path d="M0,-8 L1.5,-1.8 L8,0 L1.5,1.8 L0,8 L-1.5,1.8 L-8,0 L-1.5,-1.8 Z" fill="#d4a574"/>
    <circle cx="0" cy="0" r="1.2" fill="#f5f0eb"/>
  </g>

  <!-- 改 kanji small -->
  <text x="82" y="38" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="14" fill="#d4a574" opacity="0.7">
    改
  </text>
</svg>
